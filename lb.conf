upstream web_server {
    # 后端节点1，权重3，优先承担更多请求压力
    server 192.168.81.130:8080 weight=3;
    # 后端节点2，权重2，辅助分担请求压力
    server 192.168.81.133:8080 weight=2;
    server 192.168.81.135:8080 weight=3;
    # 核心指令：检测间隔3秒，失败3次剔除，成功2次加入，超时2秒
    check interval=3000 rise=2 fall=3 timeout=2000 type=http;
    #check_http_send "GET /health_check HTTP/1.1\r\nHost: www.01345.cn\r\n";
    check_http_send "GET /health_check HTTP/1.1\r\nHost: www.01345.cn\r\nConnection: keep-alive\r\n\r\n";
    check_http_expect_alive http_2xx http_3xx;
}
