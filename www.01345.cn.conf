

# ==============================================
# 虚拟主机站点配置：conf/www.test.com.conf
# 全站HTTPS、反向代理、日志、上传限制、状态监控配置
# ==============================================
server {
    # 监听443端口并开启SSL加密，提供HTTPS访问服务
    listen 443 ssl;
    # 绑定当前站点域名，匹配用户访问域名
    server_name www.01345.cn 01345.cn;

    # 加载SSL公钥证书文件
    ssl_certificate ssl/www.test.com.pem;
    # 加载SSL私钥文件，实现HTTPS双向加密校验
    ssl_certificate_key ssl/www.test.com.key;
  
    # 全局请求体限制：允许最大100MB文件上传，适配大文件业务场景
    client_max_body_size 100M;

    # 自定义站点访问日志，独立存储集群访问与转发记录
    access_log /data/logs/nginx/lb_access_$year-$month-$day.log main;
    # 自定义站点错误日志，单独记录当前站点故障信息
    error_log /data/logs/nginx/lb_error.log error;

    # 根路径反向代理规则，拦截所有用户请求
    location / {
        # 将所有请求转发至upstream定义的web_server后端集群
        proxy_pass http://web_server;

        # 向后端传递真实访问域名，解决多站点跳转异常
        proxy_set_header Host $host;
        # 向后端传递客户端真实IP，用于日志溯源、安全拦截
        proxy_set_header X-Real-IP $remote_addr;
        # 传递完整代理链路IP，适配多层代理架构，完整溯源请求路径
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 向后端传递真实访问协议（HTTP/HTTPS），解决HTTPS跳转死循环问题
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理连接超时300秒，适配大文件长连接握手
        proxy_connect_timeout 300s;
        # 后端数据发送超时300秒，避免大文件传输中断
        proxy_send_timeout 300s;
        # 后端响应读取超时300秒，适配大文件后端处理耗时
        proxy_read_timeout 300s;
    }

}

# ==============================================
# HTTP强制跳转HTTPS配置
# ==============================================
server {
    # 监听HTTP 80端口所有请求
    listen 80;
    # 匹配主域名与www子域名
    server_name www.test.com test.com;
    # 永久301重定向，强制所有HTTP请求跳转至HTTPS，实现全站加密
    return 301 https://$host$request_uri;
}
